<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificar vendedor</title>

    <link rel="stylesheet"
          href="./src/css/calificaciones.css">
</head>
<body>

    <div class="contenedor">

        <h1>Calificar vendedor</h1>

        <h3 id="nombreVendedor">
            Juan Pérez
        </h3>

        <div class="estrellas">

            <span data-value="1">★</span>
            <span data-value="2">★</span>
            <span data-value="3">★</span>
            <span data-value="4">★</span>
            <span data-value="5">★</span>

        </div>

        <textarea
            id="comentario"
            placeholder="Escribe una opinión">
        </textarea>

        <button id="btnEnviar">

            Guardar Calificación

        </button>

    </div>

    <script src="./src/js/calificaciones.js"></script>

</body>
</html>
