<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar producto — UD Marketplace</title>
  <link rel="stylesheet" href="./src/css/registroProducto.css">
</head>
<body>
  <div class="contenedor">

    <div class="panel-izquierdo">
      <div class="logo">🎓 UD Marketplace</div>
      <img src="./src/img/registro.png" alt="Registro" class="imagen">
      <h2>Únete a nuestra comunidad</h2>
      <p>Compra y vende dentro de la comunidad universitaria de la Universidad Distrital.</p>
    </div>

    <div class="panel-derecho">
      <h1>Completa tu información</h1>

      <form id="formRegistroProductos">

        <div class="fila">
          <div class="grupo">
            <label>Nombre del producto</label>
            <input type="text" id="nombreProducto">
            <small class="error"></small>
          </div>
          <div class="grupo">
            <label>Descripción del producto</label>
            <textarea id="descripcion"></textarea>
            <small class="error"></small>
          </div>
        </div>

        <div class="fila">

          <!-- SEDE reemplaza al input de ubicación -->
          <div class="grupo">
            <label>Sede de venta</label>
            <select id="sede">
              <option value="">Cargando sedes...</option>
            </select>
            <small class="error"></small>
          </div>

          <div class="grupo">
            <label>Precio</label>
            <input type="text" id="precio">
            <small class="error"></small>
          </div>

        </div>

        <div class="grupo">
          <label>Categoría</label>
          <select id="categoria">
            <option value="">Cargando categorías...</option>
          </select>
          <small class="error"></small>
        </div>

        <div class="grupo">
          <label>Imagen</label>
          <input type="file" id="imagen" accept="image/*">
          <small class="error"></small>
        </div>

        <button type="submit" id="btnRegistrar" class="btn-primario">Completar Registro →</button>
        <button type="button" id="btnRegresar" class="btn-secundario">Regresar</button>

      </form>
    </div>

  </div>
  <script src="./src/js/registroProductos.js"></script>
</body>
</html>
