<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo</title>
    <link rel="stylesheet" href="./src/css/venderProductos.css">
</head>
<body>
    <header>
        <div class="logo">
            🎓 UD Marketplace - Administrador
        </div>
        <div class="busqueda">
            </div>
        <div id="accionesUsuario">
            <button type="button" id="adminName" style="background: none; border: none; cursor: default; font-weight: bold;">
                Cargando perfil...
            </button>
            
            <button id="btnCerrarSesion">
                Cerrar sesión
            </button>
        </div>
    </header>

    <main>
        <div class="panel-header">
            <div class="panel-info">
                <h2>Vista General del Sistema</h2>
                <p>Panel Administrativo Exclusivo</p>
            </div>
        </div>    

        <section class="productos" style="display: flex; flex-direction: column; gap: 20px; padding: 20px;">
            
            <div class="card" style="width: 100%; padding: 20px; box-sizing: border-box; display: block;">
                <h3 style="margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px;">Estado del Sistema</h3>
                <div id="dashboardContent">
                    <p>Consultando al servidor...</p>
                </div>
            </div>

            <div class="card" style="width: 100%; padding: 20px; box-sizing: border-box; display: block;">
                <h3 style="margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px;">Información de Sedes (Grupo 2)</h3>
                <p style="margin-bottom: 15px;">Consulta la lista de sedes registradas en el sistema.</p>
                
                <button id="btnLoadReports" style="background-color: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer;">
                    Cargar Sedes
                </button>
                
                <div style="margin-top: 15px; background-color: #1e293b; color: #f8fafc; padding: 15px; border-radius: 5px; overflow-x: auto;">
                    <pre id="reportData" style="margin: 0; font-family: monospace;">Esperando solicitud...</pre>
                </div>
            </div>

        </section>
    </main>
    
    <script src="js/admin.js"></script>
</body>
</html>
