<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis productos — UD Marketplace</title>
  <link rel="stylesheet" href="./src/css/venderProductos.css">
</head>
<body>

  <header>
    <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">
      🎓 UD Marketplace
    </div>
    <div class="busqueda">
      <input type="text" placeholder="Buscar productos...">
    </div>
    <div id="accionesUsuario">
      <button type="button" id="btnComprarProductos">Comprar productos</button>
      <button type="button" id="btnPerfil">Mi perfil</button>
      <button type="button" id="btnCerrarSesion">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <div class="panel-header">
      <div class="panel-info">
        <h2>Mis productos</h2>
        <p>Gestiona lo que tienes a la venta</p>
      </div>
      <button type="button" id="btnAgregarProducto">+ Agregar producto</button>
    </div>

    <section class="productos">
      <div id="contenedorMisProductos"></div>
    </section>
  </main>

  <script src="./src/js/venderProductos.js"></script>
</body>
</html>
