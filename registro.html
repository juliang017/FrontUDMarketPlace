<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - UD Marketplace</title>

    <link rel="stylesheet" href="./src/css/estilos.css">
</head>

<body>

    <div class="contenedor">

        <!-- PANEL IZQUIERDO -->
        <div class="panel-izquierdo">

            <div class="logo">
                🎓 UD Marketplace
            </div>

            <img src="./src/img/registro.png"
                 alt="Registro"
                 class="imagen">

            <h2>Únete a nuestra comunidad</h2>

            <p>
                Compra y vende dentro de la comunidad
                universitaria de la Universidad Distrital.
            </p>

        </div>

        <!-- PANEL DERECHO -->
        <div class="panel-derecho">

            <h1>Completa tu información</h1>

            <form id="formRegistro">

                <div class="fila">

                    <div class="grupo">
                        <label>Primer Nombre *</label>
                        <input type="text" id="primerNombre">
                        <small class="error"></small>
                    </div>

                    <div class="grupo">
                        <label>Segundo Nombre</label>
                        <input type="text" id="segundoNombre">
                    </div>

                </div>

                <div class="fila">

                    <div class="grupo">
                        <label>Primer Apellido *</label>
                        <input type="text" id="primerApellido">
                        <small class="error"></small>
                    </div>

                    <div class="grupo">
                        <label>Segundo Apellido</label>
                        <input type="text" id="segundoApellido">
                    </div>

                </div>

                <div class="grupo">
                    <label>Fecha de Nacimiento *</label>
                    <input type="date" id="fechaNacimiento">
                    <small class="error"></small>
                </div>

                <div class="grupo">
                    <label>Correo Institucional *</label>
                    <input type="email"
                           id="correo"
                           placeholder="usuario@udistrital.edu.co">
                    <small class="error"></small>
                </div>

                <div class="grupo">
                    <label>Teléfono *</label>
                    <input type="text"
                           id="telefono"
                           placeholder="3001234567">
                    <small class="error"></small>
                </div>

                <div class="grupo">
                    <label>Contraseña *</label>
                    <input type="password"
                           id="contrasena"
                           placeholder="Contraseña">
                    <small class="error"></small>
                    <label>Confirmar contraseña *</label>
                    <input type="password"
                           id="confirmarContrasena"
                           placeholder="Contraseña">
                    <small class="error"></small>
                </div>

                <button type="submit">
                    Completar Registro →
                </button>
                <button type="button" id="volver">
                    ← Volver
                </button>

            </form>

        </div>

    </div>
<script src="./src/js/registro.js"></script>

</body>

    



</html>
